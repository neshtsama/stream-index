<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamIndex - Premium Streaming</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS Variables & Reset */
        :root {
            --bg-base: #0a0b0d;
            --bg-surface: #141517;
            --bg-elevated: #1f2023;
            --bg-hover: #2a2b2f;
            --primary: #e50914;
            --primary-hover: #f40612;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: rgba(255, 255, 255, 0.1);
            --nav-height: 70px;
            --z-nav: 1000;
            --z-modal: 2000;
            --z-toast: 3000;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */
        h1, h2, h3, h4 { font-weight: 700; line-height: 1.2; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input { font-family: inherit; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Navigation Header */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            background: linear-gradient(to bottom, rgba(10,11,13,0.95) 0%, rgba(10,11,13,0) 100%);
            z-index: var(--z-nav);
            transition: var(--transition);
        }
        .navbar.scrolled {
            background: rgba(10, 11, 13, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            letter-spacing: -1px;
        }
        .logo span { color: var(--text-primary); }

        .nav-links { display: flex; gap: 24px; }
        .nav-link {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-link:hover, .nav-link.active { color: var(--text-primary); }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        
        /* Search Bar */
        .search-container { position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: 12px; color: var(--text-secondary); pointer-events: none; }
        .search-input {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px 8px 36px;
            border-radius: 20px;
            font-size: 0.9rem;
            width: 200px;
            transition: var(--transition);
        }
        .search-input:focus {
            width: 280px;
            border-color: var(--text-muted);
            outline: none;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
        }

        /* User Profile & Dropdown */
        .user-menu-container { position: relative; }
        .user-profile {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            padding: 4px 8px; border-radius: 20px; transition: var(--transition);
        }
        .user-profile:hover { background: var(--bg-surface); }
        .avatar {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem;
        }
        .user-dropdown {
            position: absolute; top: calc(100% + 10px); right: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            width: 200px;
            padding: 8px 0;
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .user-menu-container:hover .user-dropdown {
            opacity: 1; visibility: visible; transform: translateY(0);
        }
        .dropdown-item {
            padding: 10px 20px; display: flex; align-items: center; gap: 12px;
            color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;
            transition: var(--transition);
        }
        .dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* Hero Section */
        .hero {
            position: relative; width: 100%; height: 85vh;
            min-height: 600px; overflow: hidden;
            display: flex; align-items: center;
        }
        .hero-backdrop {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center top;
            transition: background-image 1s ease-in-out;
        }
        .hero-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(10,11,13,0.9) 0%, rgba(10,11,13,0.4) 50%, rgba(10,11,13,0) 100%),
                        linear-gradient(0deg, var(--bg-base) 0%, rgba(10,11,13,0) 30%);
        }
        .hero-content {
            position: relative; z-index: 10; padding: 0 4%;
            max-width: 800px; margin-top: 50px;
            animation: fadeIn 1s ease-out;
        }
        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            margin-bottom: 15px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .hero-meta {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
            color: var(--text-secondary); font-size: 0.95rem; font-weight: 500;
        }
        .hero-match { color: #46d369; font-weight: 600; }
        .hero-overview {
            font-size: 1.1rem; line-height: 1.6; color: var(--text-secondary);
            margin-bottom: 30px; display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .hero-actions { display: flex; gap: 16px; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 28px; border-radius: var(--radius-md); font-weight: 600;
            font-size: 1.05rem; cursor: pointer; border: none; transition: var(--transition);
        }
        .btn-primary { background: var(--text-primary); color: var(--bg-base); }
        .btn-primary:hover { background: rgba(255,255,255,0.7); }
        .btn-secondary { background: rgba(109, 109, 110, 0.7); color: white; }
        .btn-secondary:hover { background: rgba(109, 109, 110, 0.4); }

        /* Carousel Indicators */
        .hero-indicators {
            position: absolute; bottom: 40px; right: 4%; z-index: 10;
            display: flex; gap: 8px;
        }
        .indicator {
            width: 24px; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 2px; cursor: pointer; transition: var(--transition);
        }
        .indicator.active { background: var(--text-primary); width: 36px; }

        /* Content Rails */
        .main-content { padding: 0 0 60px 0; position: relative; z-index: 20; margin-top: -80px; }
        .rail-section { margin-bottom: 40px; padding: 0 4%; }
        .rail-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 16px;
        }
        .rail-title { font-size: 1.3rem; font-weight: 600; color: var(--text-primary); }
        
        .rail-container {
            position: relative; 
            display: flex; align-items: center;
        }
        .movie-rail {
            display: flex; gap: 16px; overflow-x: auto; scroll-behavior: smooth;
            padding: 10px 0 20px 0; scrollbar-width: none;
        }
        .movie-rail::-webkit-scrollbar { display: none; }
        
        /* Movie Cards */
        .movie-card {
            flex: 0 0 220px; border-radius: var(--radius-md); overflow: hidden;
            background: var(--bg-surface); cursor: pointer; position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        @media (max-width: 768px) { .movie-card { flex: 0 0 150px; } }

        .movie-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .card-poster {
            width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block;
        }
        
        .card-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center;
            justify-content: center; opacity: 0; transition: opacity 0.3s ease;
        }
        .movie-card:hover .card-overlay { opacity: 1; }
        .play-circle {
            width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid white; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); color: white; font-size: 1.2rem;
            transform: scale(0.8); transition: transform 0.3s ease;
        }
        .movie-card:hover .play-circle { transform: scale(1); }

        /* Progress Bar (For Continue Watching) */
        .progress-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 4px; background: rgba(255,255,255,0.2);
        }
        .progress-fill { height: 100%; background: var(--primary); }

        /* Search Results Grid */
        #search-results-section { display: none; padding: 100px 4% 40px; min-height: 100vh; }
        .search-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px;
            margin-top: 20px;
        }

        /* Skeleton Loaders */
        .skeleton { background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-hover) 50%, var(--bg-surface) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { flex: 0 0 220px; aspect-ratio: 2/3; border-radius: var(--radius-md); }
        
        /* Auth Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: var(--z-modal); opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .auth-card {
            background: var(--bg-elevated); width: 100%; max-width: 450px;
            border-radius: var(--radius-lg); padding: 40px; position: relative;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .auth-card { transform: scale(1); }
        
        .close-modal {
            position: absolute; top: 20px; right: 20px; background: none; border: none;
            color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; transition: color 0.2s;
        }
        .close-modal:hover { color: var(--text-primary); }
        
        .auth-header { margin-bottom: 30px; }
        .auth-title { font-size: 1.8rem; margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-label {
            display: block; margin-bottom: 8px; font-size: 0.9rem;
            color: var(--text-secondary); font-weight: 500;
        }
        .form-input {
            width: 100%; background: var(--bg-surface); border: 1px solid var(--border);
            color: var(--text-primary); padding: 14px 16px; border-radius: var(--radius-md);
            font-size: 1rem; transition: border-color 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--text-muted); }
        
        .auth-btn { width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 10px; }
        .auth-switch { text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem; }
        .auth-switch span { color: var(--text-primary); cursor: pointer; font-weight: 600; }
        .auth-switch span:hover { text-decoration: underline; }

        /* Toast Notifications */
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-elevated); border-left: 4px solid var(--primary);
            color: var(--text-primary); padding: 16px 24px; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 0.95rem; font-weight: 500;
            transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 12px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: #46d369; }

        /* Footer */
        footer {
            background: var(--bg-surface); border-top: 1px solid var(--border);
            padding: 40px 4%; text-align: center; color: var(--text-muted); font-size: 0.9rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <div class="logo" onclick="resetView()">Stream<span>Index</span></div>
            <ul class="nav-links">
                <li><button class="nav-link active" onclick="resetView()">Home</button></li>
                <li><button class="nav-link" onclick="scrollToRail('rail-Animation & Anime')">Anime</button></li>
                <li><button class="nav-link" onclick="scrollToRail('rail-Action & Adventure')">Action</button></li>
                <li><button class="nav-link" onclick="scrollToRail('rail-Sci-Fi & Fantasy')">Sci-Fi</button></li>
            </ul>
        </div>
        
        <div class="nav-right">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Titles, genres..." oninput="handleSearch()">
            </div>
            
            <div class="user-menu-container" id="user-menu-wrap">
                <div class="user-profile" id="user-btn" onclick="openAuthModal()">
                    <div class="avatar" id="avatar-char"><i class="fas fa-user"></i></div>
                    <span id="username-display">Sign In</span>
                </div>
                <!-- Dropdown will be injected via JS if logged in -->
            </div>
        </div>
    </nav>

    <!-- Main View container (Hero + Categories) -->
    <div id="main-view">
        <!-- Hero Section -->
        <header class="hero" id="hero-section">
            <div class="hero-backdrop" id="hero-backdrop" style="background-image: url('');"></div>
            <div class="hero-vignette"></div>
            
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">Loading...</h1>
                <div class="hero-meta">
                    <span class="hero-match">98% Match</span>
                    <span id="hero-year">2026</span>
                    <span class="age-rating">HD</span>
                </div>
                <p class="hero-overview" id="hero-overview"></p>
                <div class="hero-actions">
                    <button class="btn btn-primary" id="hero-play-btn"><i class="fas fa-play"></i> Play</button>
                    <button class="btn btn-secondary"><i class="fas fa-info-circle"></i> More Info</button>
                </div>
            </div>
            
            <div class="hero-indicators" id="hero-indicators"></div>
        </header>

        <!-- Dynamic Content Rails -->
        <main class="main-content">
            <!-- Continue Watching (Only visible if logged in and has progress) -->
            <section class="rail-section" id="continue-watching-section" style="display: none;">
                <div class="rail-header"><h2 class="rail-title">Continue Watching for You</h2></div>
                <div class="rail-container">
                    <div class="movie-rail" id="continue-rail"></div>
                </div>
            </section>
            
            <!-- Injection point for TMDB genre rails -->
            <div id="genre-rails-container"></div>
        </main>
    </div>

    <!-- Search Results View -->
    <div id="search-results-section">
        <h2 class="rail-title">Search Results</h2>
        <div class="search-grid" id="search-grid"></div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="auth-card">
            <button class="close-modal" onclick="closeAuthModal()"><i class="fas fa-times"></i></button>
            <div class="auth-header">
                <h2 class="auth-title" id="auth-title">Sign In</h2>
                <p class="auth-subtitle" id="auth-subtitle">Welcome back to StreamIndex.</p>
            </div>
            
            <form id="auth-form" onsubmit="submitAuth(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="auth-email" class="form-input" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="auth-submit-btn">Sign In</button>
            </form>
            
            <div class="auth-switch">
                <p id="auth-switch-text">New to StreamIndex? <span onclick="toggleAuthMode()">Sign up now.</span></p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <footer>
        <p>&copy; 2026 StreamIndex. Built with Supabase & TMDB.</p>
    </footer>

    <script>
        // ==========================================
        // 1. CONFIGURATION & STATE
        // ==========================================
        
        // Supabase Init using user's keys
        const SUPABASE_URL = 'https://iqmxvknctktprijalic.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_IXicSQIcfL_yhFUgRH8Qfg_3qwmqqML';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // TMDB Config
        const TMDB_KEY = '8950f9f8257d45a24d373932a74ba2ec';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w500';
        const IMG_BASE_ORIGINAL = 'https://image.tmdb.org/t/p/original';

        // App State
        let currentUser = null;
        let isSignUpMode = false;
        let heroItems = [];
        let currentHeroIndex = 0;
        let heroInterval;
        let searchTimeout;

        // Categories to render (Custom tailored, including Animation as implicit preference)
        const categories = [
            { id: 'trending', name: 'Trending Now', endpoint: '/trending/all/week' },
            { id: '16', name: 'Animation & Anime', endpoint: '/discover/movie?with_genres=16' },
            { id: '28', name: 'Action & Adventure', endpoint: '/discover/movie?with_genres=28' },
            { id: '878', name: 'Sci-Fi & Fantasy', endpoint: '/discover/movie?with_genres=878' },
            { id: '35', name: 'Comedies', endpoint: '/discover/movie?with_genres=35' }
        ];

        // ==========================================
        // 2. INITIALIZATION
        // ==========================================
        
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            initApp();
            
            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('navbar');
                if (window.scrollY > 50) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            });
        });

        async function initApp() {
            renderSkeletons();
            await fetchHeroContent();
            buildCategoryRails();
        }

        // ==========================================
        // 3. AUTHENTICATION (SUPABASE)
        // ==========================================

        async function initAuth() {
            // Get initial session
            const { data: { session } } = await supabase.auth.getSession();
            handleUserState(session?.user || null);

            // Listen for changes
            supabase.auth.onAuthStateChange((_event, session) => {
                handleUserState(session?.user || null);
                if (session?.user) loadContinueWatching();
            });
        }

        function handleUserState(user) {
            currentUser = user;
            const btnWrap = document.getElementById('user-menu-wrap');
            const display = document.getElementById('username-display');
            const avatar = document.getElementById('avatar-char');

            if (user) {
                const emailPrefix = user.email.split('@')[0];
                display.innerText = emailPrefix;
                avatar.innerHTML = emailPrefix.charAt(0).toUpperCase();
                
                // Add dropdown
                let dropdown = document.getElementById('auth-dropdown');
                if (!dropdown) {
                    dropdown = document.createElement('div');
                    dropdown.id = 'auth-dropdown';
                    dropdown.className = 'user-dropdown';
                    dropdown.innerHTML = `
                        <div class="dropdown-item" onclick="signOut()"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
                    `;
                    btnWrap.appendChild(dropdown);
                }
                
                // Remove onclick from profile btn so it doesn't open modal when logged in
                document.getElementById('user-btn').onclick = null;
                
                loadContinueWatching();
            } else {
                display.innerText = 'Sign In';
                avatar.innerHTML = '<i class="fas fa-user"></i>';
                const dropdown = document.getElementById('auth-dropdown');
                if (dropdown) dropdown.remove();
                
                document.getElementById('user-btn').onclick = openAuthModal;
                document.getElementById('continue-watching-section').style.display = 'none';
            }
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.add('active');
            isSignUpMode = false;
            updateAuthUI();
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.remove('active');
            document.getElementById('auth-form').reset();
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            updateAuthUI();
        }

        function updateAuthUI() {
            document.getElementById('auth-title').innerText = isSignUpMode ? 'Create Account' : 'Sign In';
            document.getElementById('auth-subtitle').innerText = isSignUpMode ? 'Join StreamIndex today.' : 'Welcome back to StreamIndex.';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'Sign Up' : 'Sign In';
            document.getElementById('auth-switch-text').innerHTML = isSignUpMode 
                ? 'Already have an account? <span onclick="toggleAuthMode()">Sign in.</span>' 
                : 'New to StreamIndex? <span onclick="toggleAuthMode()">Sign up now.</span>';
        }

        async function submitAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-submit-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                if (isSignUpMode) {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    showToast("Account created successfully. You can now sign in.", "success");
                    toggleAuthMode();
                } else {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showToast("Signed in successfully.", "success");
                    closeAuthModal();
                }
            } catch (err) {
                showToast(err.message || "Authentication failed.");
            } finally {
                btn.innerHTML = isSignUpMode ? 'Sign Up' : 'Sign In';
                btn.disabled = false;
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            showToast("Signed out successfully.");
        }

        // ==========================================
        // 4. DATA FETCHING & RENDERING (TMDB)
        // ==========================================

        async function fetchTMDB(endpoint) {
            try {
                const sep = endpoint.includes('?') ? '&' : '?';
                const url = `${TMDB_BASE}${endpoint}${sep}api_key=${TMDB_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.results || [];
            } catch (error) {
                console.error('TMDB Error:', error);
                return [];
            }
        }

        async function fetchHeroContent() {
            const results = await fetchTMDB('/trending/all/day');
            heroItems = results.slice(0, 5); // Keep top 5 for carousel
            
            if (heroItems.length > 0) {
                renderHeroSlide(0);
                buildHeroIndicators();
                startHeroAutoPlay();
            }
        }

        function renderHeroSlide(index) {
            if (!heroItems[index]) return;
            currentHeroIndex = index;
            const item = heroItems[index];
            
            const title = item.title || item.name;
            const date = item.release_date || item.first_air_date || '';
            const year = date ? date.split('-')[0] : '';
            
            const backdropEl = document.getElementById('hero-backdrop');
            backdropEl.style.backgroundImage = `url('${IMG_BASE_ORIGINAL}${item.backdrop_path}')`;
            
            document.getElementById('hero-title').innerText = title;
            document.getElementById('hero-year').innerText = year;
            document.getElementById('hero-overview').innerText = item.overview || 'No synopsis available.';
            
            const playBtn = document.getElementById('hero-play-btn');
            playBtn.onclick = () => window.location.href = `watch.html?id=${item.id}&title=${encodeURIComponent(title)}`;
            
            // Update dots
            document.querySelectorAll('.indicator').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === index);
            });
        }

        function buildHeroIndicators() {
            const container = document.getElementById('hero-indicators');
            container.innerHTML = '';
            heroItems.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `indicator ${idx === 0 ? 'active' : ''}`;
                dot.onclick = () => {
                    clearInterval(heroInterval);
                    renderHeroSlide(idx);
                    startHeroAutoPlay();
                };
                container.appendChild(dot);
            });
        }

        function startHeroAutoPlay() {
            clearInterval(heroInterval);
            heroInterval = setInterval(() => {
                let next = currentHeroIndex + 1;
                if (next >= heroItems.length) next = 0;
                renderHeroSlide(next);
            }, 7000);
        }

        // --- Category Rails --- //

        function renderSkeletons() {
            const container = document.getElementById('genre-rails-container');
            container.innerHTML = '';
            
            categories.forEach(cat => {
                const section = document.createElement('section');
                section.className = 'rail-section';
                section.innerHTML = `
                    <div class="rail-header"><h2 class="rail-title">${cat.name}</h2></div>
                    <div class="movie-rail">
                        ${Array(7).fill('<div class="skeleton skeleton-card"></div>').join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        async function buildCategoryRails() {
            const container = document.getElementById('genre-rails-container');
            container.innerHTML = ''; // clear skeletons

            for (const cat of categories) {
                const items = await fetchTMDB(cat.endpoint);
                if (!items || items.length === 0) continue;

                const section = document.createElement('section');
                section.className = 'rail-section';
                section.id = `rail-${cat.name}`;
                
                let cardsHtml = '';
                items.forEach(item => {
                    if (!item.poster_path) return;
                    const title = item.title || item.name;
                    cardsHtml += `
                        <div class="movie-card" onclick="window.location.href='watch.html?id=${item.id}&title=${encodeURIComponent(title)}&poster=${encodeURIComponent(item.poster_path)}'">
                            <img src="${IMG_BASE}${item.poster_path}" alt="Poster" class="card-poster" loading="lazy">
                            <div class="card-overlay">
                                <div class="play-circle"><i class="fas fa-play"></i></div>
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="rail-header"><h2 class="rail-title">${cat.name}</h2></div>
                    <div class="rail-container">
                        <div class="movie-rail">${cardsHtml}</div>
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function scrollToRail(id) {
            const el = document.getElementById(id);
            if(el) {
                resetView();
                const headerOffset = 100;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
            }
        }

        // ==========================================
        // 5. CONTINUE WATCHING (SUPABASE RLS)
        // ==========================================

        async function loadContinueWatching() {
            if (!currentUser) return;
            
            try {
                const { data, error } = await supabase
                    .from('watch_progress')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('updated_at', { ascending: false });

                if (error) throw error;

                const section = document.getElementById('continue-watching-section');
                const rail = document.getElementById('continue-rail');
                
                if (!data || data.length === 0) {
                    section.style.display = 'none';
                    return;
                }

                section.style.display = 'block';
                rail.innerHTML = '';
                
                data.forEach(item => {
                    // Avoid showing 100% completed items in continue watching
                    if(item.progress_percent > 95) return; 

                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.onclick = () => window.location.href = `watch.html?id=${item.media_id}&title=${encodeURIComponent(item.title)}&t=${item.timestamp_seconds}`;
                    
                    const posterSrc = item.poster_url && item.poster_url !== 'null' ? `${IMG_BASE}${item.poster_url}` : 'https://via.placeholder.com/220x330?text=No+Poster';

                    card.innerHTML = `
                        <img src="${posterSrc}" alt="Poster" class="card-poster">
                        <div class="card-overlay">
                            <div class="play-circle"><i class="fas fa-play"></i></div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-fill" style="width: ${item.progress_percent}%"></div>
                        </div>
                    `;
                    rail.appendChild(card);
                });

                // If all filtered out, hide section
                if(rail.children.length === 0) section.style.display = 'none';

            } catch (err) {
                console.error("Failed to load continue watching:", err);
            }
        }

        // ==========================================
        // 6. SEARCH FUNCTIONALITY
        // ==========================================

        function handleSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (query.length < 2) {
                resetView();
                return;
            }

            searchTimeout = setTimeout(async () => {
                document.getElementById('main-view').style.display = 'none';
                const searchSection = document.getElementById('search-results-section');
                const searchGrid = document.getElementById('search-grid');
                searchSection.style.display = 'block';
                
                searchGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
                
                const results = await fetchTMDB(`/search/multi?query=${encodeURIComponent(query)}`);
                const filtered = results.filter(i => (i.media_type === 'movie' || i.media_type === 'tv') && i.poster_path);
                
                if (filtered.length === 0) {
                    searchGrid.innerHTML = '<div style="grid-column: 1/-1; color: var(--text-muted);">No results found.</div>';
                    return;
                }

                searchGrid.innerHTML = '';
                filtered.forEach(item => {
                    const title = item.title || item.name;
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.onclick = () => window.location.href = `watch.html?id=${item.id}&title=${encodeURIComponent(title)}&poster=${encodeURIComponent(item.poster_path)}`;
                    card.innerHTML = `
                        <img src="${IMG_BASE}${item.poster_path}" alt="Poster" class="card-poster" loading="lazy">
                        <div class="card-overlay">
                            <div class="play-circle"><i class="fas fa-play"></i></div>
                        </div>
                    `;
                    searchGrid.appendChild(card);
                });
            }, 500); // 500ms debounce
        }

        function resetView() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-results-section').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // 7. UTILITIES
        // ==========================================

        function showToast(message, type = 'default') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '<i class="fas fa-check-circle" style="color:#46d369"></i>' : '<i class="fas fa-info-circle"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3s
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
